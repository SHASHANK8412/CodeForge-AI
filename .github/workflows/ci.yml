# AIForge CI: lint + the deterministic test suites on every push and pull request.
# The full suite (about 40 minutes, partly Docker- and model-dependent) runs locally; CI runs the suites that need
# neither a model server nor Docker, so a green check means those really passed - nothing is skipped to get there.
name: CI

on:
  push:
    branches: [main, ai-forge-v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names)
        run: python -m ruff check backend tests --select E9,F63,F7,F82

      - name: Tests
        env:
          AIFORGE_TEST_SANDBOX: local          # generated-project tests run in a local venv (the explicit test opt-in)
          AIFORGE_GUARDIAN_CONTAINERS: "off"   # container checks are reported BLOCKED, never passed
          AIFORGE_LLM_REPAIR: "0"
          AIFORGE_PREVIEW: "off"
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/security tests/test_path_traversal.py tests/test_tool_security.py
          tests/compatibility tests/execution_guardian
          tests/test_workflow.py tests/test_pipeline_integration.py tests/test_llm_timeout_and_fallback.py
          tests/test_day13_collaboration.py tests/kubernetes tests/infrastructure
          tests/test_extraordinary_features.py tests/test_knowledge.py tests/test_main.py
          tests/test_quality_evidence.py tests/test_reviewer_validation.py

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
